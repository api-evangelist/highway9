name: Highway9
description: >-
  Highway 9 Networks is a Silicon Valley company delivering AI Wireless
  Infrastructure as a Service through its Virtual Mobile/AI Cloud (VMC)
  platform. The platform combines a cloud control plane (Mobile Center), a
  distributed 5G core and edge AI services (Mobile Edge), private 5G wireless
  infrastructure (Mobile Network), and connected device/workload groupings
  (Mobile Zones) to give enterprises deterministic, ultra-reliable private
  mobile networks and in-building cellular coverage. It targets manufacturing
  and warehousing (autonomous robots, drones, logistics), higher education (AI
  labs and research), and energy (predictive maintenance, remote operations).
  The Mobile Center Streaming APIs let partners integrate configuration, device
  management, monitoring, analytics, and operational workflows with the
  platform. Founded by an ex-VMware team behind NSX/SDN, hybrid cloud, and the
  Telco 5G/Edge cloud platform.
