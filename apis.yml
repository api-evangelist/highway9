apis:
- name: Mobile Center Streaming APIs
  description: >-
    Mobile Center APIs from Highway 9 Networks enable partners to integrate
    configuration, device management, monitoring, analytics, and operational
    workflows with the Virtual Mobile Cloud platform. Resource groups span
    access and configuration, device management (DeviceInfo, DeviceGroup),
    alerts and notifications (Alarm, alertProfile, alertsTemplate), telemetry
    and audit logs (AuditLog), security and authentication (apiToken,
    Certificate), application management (Application, Attribute), operator and
    carrier metadata (carrierInfo, mnoOperator), and assistive services
    (chatbot). The full OpenAPI reference is available inside the partner portal
    for signed partners.
  humanURL: https://www.highway9.com/mobile-center-streaming-apis/
